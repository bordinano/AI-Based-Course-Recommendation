services:
  db:
    image: postgres:16
    container_name: ai-course-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: course_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: course_recommendation
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - ai_course_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U course_app -d course_recommendation"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ai_course_pgdata:
